name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-secret"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs dependencies for all workspaces and (via server's postinstall
      # hook) generates the Prisma client for this runner's OS/architecture.
      - run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:ci -w server

      - name: Seed demo data (verifies the seed script runs end-to-end)
        run: npm run seed -w server

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test the built server
        run: |
          PORT=4000 node server/dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 0.5
          done
          curl -sf http://localhost:4000/api/health
          echo
          kill $SERVER_PID
